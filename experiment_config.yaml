# Experimental campaign configuration (the factor matrix + repetitions, PDR §7.9).
# Read by experiment/runner.py. Every effect is a reversible local JSON mutation;
# run `python scripts/reset_data.py` afterwards to restore the benign seeds.
#
# All attack *text* now lives in messages.yaml (system prompt, benign carrier,
# and the two injections). This file only selects the factor matrix. The
# assistant's actual responses are written to results/ + logs/, which are
# git-ignored, so harmful output never enters version control (PDR §15/§16).

# --- Models under test (the aligned vs unaligned comparison) ---
models: ["qwen2.5-tools:7b", "dolphin3-tools:8b"]   # main assistant LLM (swept); both are local builds with a corrected tool template (models/)
judge_model: "gemma2:9b"                        # grades the harmful attack on the FULL message chain
generator_model: "dolphin3:8b"                  # UNALIGNED rewriter: aligned gemma2 diluted the harmful objective (bomb -> "reinforce my windows"); dolphin keeps it. Judge stays aligned.

# --- Attack families (each measures its own effectiveness) ---
#   agentic — makes the assistant CALL A TOOL (open the window); scored by the
#             home_state side effect (target/target_room below).
#   harmful — makes the assistant GENERATE disallowed content; scored by the
#             LLM judge on the assistant's final answer.
attack_types: ["agentic", "harmful"]

# --- Factor matrix (swept) ---
strategies: ["S1", "S2", "S3"]        # S1 = baseline (instruction only, num_facts 0)
num_facts: [0, 1, 2, 5, 10, 25, 50, 100, 150, 200] #25, 50, 100, 150, 200
fact_sources: ["real", "invented", "mixed"]
repetitions: 1                        # R repetitions per fact-bearing cell
baseline_repetitions: 10              # S1 baseline (num_facts 0) reps per (model, attack_type): more data for the S1 comparison

# --- Injection channel & target ---
# The experiment focuses on EMAIL input: the injection rides in the email BODY
# (no character limit, unlike a subject). For calendar use `channel: calendar`
# and `target_field: description` (the event description, not the title).
channel: "email"                       # email | calendar
target_field: "body"                   # email: subject|body ; calendar: title|description
target: "open_window"                  # agentic-attack success metric: open_window | set_boiler
target_room: "living_room"             # room checked when target == open_window

# --- Sampling / determinism ---
base_seed: 1000                        # per-rep seeds derive from this (logged per row)
mix_ratio: 0.5                         # fraction of real facts when fact_source == mixed

# --- Adaptive red-teaming loop (PDR: attacker adapts up to N times per case) ---
# Each case retries the injection up to max_attempts times, stopping at the first
# success. Between attempts the prompt is adapted: base injection -> LLM judge
# rewrite (<prompt>...</prompt>) -> predetermined list in messages.yaml.
max_attempts: 5                        # attack attempts per case (1 = single shot)
adaptive: true                         # false forces a single attempt (wide sweeps)
